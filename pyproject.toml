[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-keyboard-rgb"
version = "0.2.0"
description = "Keyboard lighting and status indicator control for GIGABYTE AERO & AORUS laptops"
readme = "README.md"
authors = [
    { name = "Devyn" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
daemon = ["psutil>=5.9"]
test = ["pytest>=7"]

[project.scripts]
aero-rgb = "aero_rgb.cli:main"

[tool.setuptools.package-data]
aero_rgb = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
