[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-keyboard-rgb"
version = "0.2.0"
description = "Keyboard lighting control and status signals for GIGABYTE AERO & AORUS laptops"
readme = "README.md"
authors = [
    { name = "Devyn" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Direct USB control without Gigabyte Control Center.
hid = ["hidapi>=0.14"]
dev = ["pytest>=7"]

[project.scripts]
aero-rgb = "aero_rgb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aero_rgb = ["keyboard_led.ps1", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
